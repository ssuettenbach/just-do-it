<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">

    <!-- Oberer Rahmenbalken -->
    <rect x="4" y="2" width="16" height="2.5" rx="1.25" fill="#D97706"/>

    <!-- Unterer Rahmenbalken -->
    <rect x="4" y="19.5" width="16" height="2.5" rx="1.25" fill="#D97706"/>

    <!-- Sanduhr-Körper (X-Form) -->
    <path
            d="M5,4.5 L19,4.5 L13,12 L19,19.5 L5,19.5 L11,12 Z"
            fill="#F59E0B"
    />

    <!-- Oberer Sand (verbleibend): Hellgelb -->
    <path
            d="M8,5.5 L16,5.5 L12,10.5 Z"
            fill="#FDE68A"
    />

    <!-- Unterer Sand (angesammelt): Dunkles Amber -->
    <path
            d="M8,18.5 L16,18.5 L12,14.5 Z"
            fill="#D97706"
    />

    <!-- Sandriesel am Flaschenhals -->
    <line
            x1="12" y1="11.2"
            x2="12" y2="13.5"
            stroke="#FDE68A"
            stroke-width="1.2"
            stroke-linecap="round"
    />

</svg>